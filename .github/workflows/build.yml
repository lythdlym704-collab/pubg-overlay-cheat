name: Build APK Clean

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 setuptools wheel

      - name: Run Buildozer
        shell: bash
        run: |
          set -o pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          buildozer android debug 2>&1 | tee build.log

      - name: Show last errors
        if: failure()
        run: |
          grep -n -i -E "error|failed|exception|not found|cannot|requires" build.log | grep -v -E "ENVIRONMENT|_ID|_URL" | tail -n 40

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
