name: Build Bot Creator & Dispatcher APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Project
        run: |
          rm -rf app/src/main/java
          mkdir -p app/src/main/java/com/bot/dispatcher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BotDispatcher"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.bot.dispatcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.bot.dispatcher"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              
              <application
                  android:label="Bot Dispatcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">
                  
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/bot/dispatcher/MainActivity.java <<'EOF'
          package com.bot.dispatcher;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private EditText tokenInput, chatIdInput, msgInput, countInput;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView sv = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 50, 40, 40);
                  root.setBackgroundColor(0xFF0B0F19);
                  sv.addView(root);

                  TextView title = new TextView(this);
                  title.setText("مُحكم البوتات السري 😈🚀");
                  title.setTextColor(0xFFEC4899);
                  title.setTextSize(20);
                  root.addView(title);

                  // زر إنشاء بوت تلقائي عبر الانتقال لـ BotFather
                  Button createBotBtn = new Button(this);
                  createBotBtn.setText("1. اضغط هنا لإنشاء بوت جديد (عبر BotFather)");
                  createBotBtn.setBackgroundColor(0xFF4F46E5);
                  createBotBtn.setTextColor(0xFFFFFFFF);
                  createBotBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/BotFather"));
                          startActivity(browserIntent);
                      }
                  });
                  root.addView(createBotBtn);

                  addLabel(root, "2. توكن البوت (الذي نسخته من BotFather)");
                  tokenInput = new EditText(this);
                  tokenInput.setHint("أدخل توكن البوت هنا");
                  tokenInput.setTextColor(0xFFFFFFFF);
                  root.addView(tokenInput);

                  addLabel(root, "3. معرف الهدف (Chat ID للمستلم)");
                  chatIdInput = new EditText(this);
                  chatIdInput.setHint("مثال: 123456789");
                  chatIdInput.setTextColor(0xFFFFFFFF);
                  root.addView(chatIdInput);

                  addLabel(root, "4. نص الرسالة الخفية");
                  msgInput = new EditText(this);
                  msgInput.setHint("اكتب رسالتك...");
                  msgInput.setTextColor(0xFFFFFFFF);
                  root.addView(msgInput);

                  addLabel(root, "5. عدد الرسائل (كم مرة تريد إرسالها؟)");
                  countInput = new EditText(this);
                  countInput.setText("5");
                  countInput.setTextColor(0xFFFFFFFF);
                  root.addView(countInput);

                  Button sendBtn = new Button(this);
                  sendBtn.setText("بدء إرسال الدفعة الخفية 💣");
                  sendBtn.setBackgroundColor(0xFFDC2626);
                  sendBtn.setTextColor(0xFFFFFFFF);
                  sendBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          final String token = tokenInput.getText().toString().trim();
                          final String chatId = chatIdInput.getText().toString().trim();
                          final String message = msgInput.getText().toString().trim();
                          final String countStr = countInput.getText().toString().trim();

                          if (token.isEmpty() || chatId.isEmpty() || message.isEmpty() || countStr.isEmpty()) {
                              Toast.makeText(MainActivity.this, "الرجاء تعبئة جميع الحقول!", Toast.LENGTH_SHORT).show();
                              return;
                          }

                          int count = 5;
                          try {
                              count = Integer.parseInt(countStr);
                          } catch (Exception e) {}

                          final int totalMessages = count;
                          Toast.makeText(MainActivity.this, "جاري إرسال " + totalMessages + " رسائل خفية...", Toast.LENGTH_SHORT).show();

                          new Thread(new Runnable() {
                              @Override
                              public void run() {
                                  for (int i = 1; i <= totalMessages; i++) {
                                      sendTelegramMessage(token, chatId, message + " (" + i + "/" + totalMessages + ")");
                                      try {
                                          Thread.sleep(1000); // فاصل ثانية بين كل رسالة والأخرى
                                      } catch (InterruptedException e) {}
                                  }
                                  Handler mainHandler = new Handler(Looper.getMainLooper());
                                  mainHandler.post(new Runnable() {
                                      @Override
                                      public void run() {
                                          Toast.makeText(MainActivity.this, "تم الانتهاء من إرسال الدفعة بنجاح! 🚀", Toast.LENGTH_LONG).show();
                                      }
                                  });
                              }
                          }).start();
                      }
                  });
                  root.addView(sendBtn);

                  setContentView(sv);
              }

              private void addLabel(LinearLayout root, String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(0xFF94A3B8);
                  tv.setPadding(0, 20, 0, 5);
                  root.addView(tv);
              }

              private void sendTelegramMessage(String token, String chatId, String message) {
                  try {
                      String urlString = "https://api.telegram.org/bot" + token + "/sendMessage";
                      URL url = new URL(urlString);
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; utf-8");
                      conn.setDoOutput(true);

                      String jsonInputString = "{\"chat_id\": \"" + chatId + "\", \"text\": \"" + message + "\"}";

                      try (OutputStream os = conn.getOutputStream()) {
                          byte[] input = jsonInputString.getBytes("utf-8");
                          os.write(input, 0, input.length);
                      }
                      conn.getResponseCode();
                  } catch (Exception e) {}
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: bot-dispatcher-apk
          path: app/build/outputs/apk/debug/*.apk

