name: Build Real Anonymous Dispatcher APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Project
        run: |
          rm -rf app/src/main/java
          mkdir -p app/src/main/java/com/anonymous/sender

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AnonSender"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.anonymous.sender'
              compileSdk 34
              defaultConfig {
                  applicationId "com.anonymous.sender"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              
              <application
                  android:label="Anonymous Sender"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">
                  
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/anonymous/sender/MainActivity.java <<'EOF'
          package com.anonymous.sender;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private EditText tokenInput, chatIdInput, msgInput;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView sv = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 60, 40, 40);
                  root.setBackgroundColor(0xFF0F172A);
                  sv.addView(root);

                  TextView title = new TextView(this);
                  title.setText("المُرسل الخفي (يعمل حقاً) 🕵️‍♂️");
                  title.setTextColor(0xFF38BDF8);
                  title.setTextSize(20);
                  root.addView(title);

                  addLabel(root, "توكن البوت (Bot Token من @BotFather)");
                  tokenInput = new EditText(this);
                  tokenInput.setHint("أدخل توكن البوت هنا");
                  tokenInput.setTextColor(0xFFFFFFFF);
                  root.addView(tokenInput);

                  addLabel(root, "معرف الهدف (Chat ID للمستلم)");
                  chatIdInput = new EditText(this);
                  chatIdInput.setHint("مثال: 123456789");
                  chatIdInput.setTextColor(0xFFFFFFFF);
                  root.addView(chatIdInput);

                  addLabel(root, "نص الرسالة السرية");
                  msgInput = new EditText(this);
                  msgInput.setHint("اكتب رسالتك هنا...");
                  msgInput.setTextColor(0xFFFFFFFF);
                  root.addView(msgInput);

                  Button sendBtn = new Button(this);
                  sendBtn.setText("إرسال بشكل مجهول تماماً 🚀");
                  sendBtn.setBackgroundColor(0xFF0284C7);
                  sendBtn.setTextColor(0xFFFFFFFF);
                  sendBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          final String token = tokenInput.getText().toString().trim();
                          final String chatId = chatIdInput.getText().toString().trim();
                          final String message = msgInput.getText().toString().trim();

                          if (token.isEmpty() || chatId.isEmpty() || message.isEmpty()) {
                              Toast.makeText(MainActivity.this, "الرجاء تعبئة جميع الحقول!", Toast.LENGTH_SHORT).show();
                              return;
                          }

                          new Thread(new Runnable() {
                              @Override
                              public void run() {
                                  sendTelegramMessage(token, chatId, message);
                              }
                          }).start();
                      }
                  });
                  root.addView(sendBtn);

                  setContentView(sv);
              }

              private void addLabel(LinearLayout root, String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(0xFF94A3B8);
                  tv.setPadding(0, 30, 0, 10);
                  root.addView(tv);
              }

              private void sendTelegramMessage(String token, String chatId, String message) {
                  try {
                      String urlString = "https://api.telegram.org/bot" + token + "/sendMessage";
                      URL url = new URL(urlString);
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; utf-8");
                      conn.setDoOutput(true);

                      String jsonInputString = "{\"chat_id\": \"" + chatId + "\", \"text\": \"" + message + "\"}";

                      try (OutputStream os = conn.getOutputStream()) {
                          byte[] input = jsonInputString.getBytes("utf-8");
                          os.write(input, 0, input.length);
                      }

                      int code = conn.getResponseCode();
                      Handler mainHandler = new Handler(Looper.getMainLooper());
                      mainHandler.post(new Runnable() {
                          @Override
                          public void run() {
                              if (code == 200) {
                                  Toast.makeText(MainActivity.this, "تم إرسال الرسالة السرية بنجاح! 🚀", Toast.LENGTH_LONG).show();
                              } else {
                                  Toast.makeText(MainActivity.this, "فشل الإرسال، تأكد من التوكن وChat ID (كود: " + code + ")", Toast.LENGTH_LONG).show();
                              }
                          }
                      });
                  } catch (Exception e) {
                      Handler mainHandler = new Handler(Looper.getMainLooper());
                      mainHandler.post(new Runnable() {
                          @Override
                          public void run() {
                              Toast.makeText(MainActivity.this, "خطأ في الاتصال بالشبكة!", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: anonymous-sender-apk
          path: app/build/outputs/apk/debug/*.apk

